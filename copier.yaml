_answers_file: .copier-answers.yaml

_exclude:
    - name-slug.jinja
    - module-slug.jinja

project_name:
    type: str
    help: What is your project name?

project_description:
    type: str
    help: What is your project description?

project_name_formatted:
    type: str
    default: "{% include 'name-slug.jinja' %}"
    when: false

module:
    type: str
    default: "{% include 'module-slug.jinja' %}"
    when: false

github:
    type: str
    help: What is your GitHub User/Organization name?

team:
    type: str
    help: What is your name or your team's name?
    when: "{{ add_extension not in ['uitk-svelte', 'uitk-webawesome', 'site-sveltekit', 'site-webawesome'] }}"

email:
    type: str
    help: What is your email?
    when: "{{ add_extension not in ['uitk-svelte', 'uitk-webawesome', 'site-sveltekit', 'site-webawesome'] }}"

add_extension:
  type: str
  help: Which project template should Copier use?
  choices:
    Python / Pure:
      value: python
    Python / C++:
      value: cpp
    Python / JavaScript:
      value: js
    Python / Rust:
      value: rust
    Python / Jupyter Widget:
      value: jupyter
    Python / Rust + JavaScript + WebAssembly:
      value: rustjswasm
    Python / C++ + JavaScript + WebAssembly:
      value: cppjswasm
    JavaScript / UI Toolkit / Svelte:
      value: uitk-svelte
    JavaScript / UI Toolkit / Lit + Web Awesome:
      value: uitk-webawesome
    JavaScript / Site / SvelteKit:
      value: site-sveltekit
    JavaScript / Site / Web Awesome:
      value: site-webawesome

_subdirectory: "{% if add_extension == 'python' %}python/pure{% elif add_extension in ['uitk-svelte', 'uitk-webawesome', 'site-sveltekit', 'site-webawesome'] %}javascript/{{ add_extension }}{% else %}python/{{ add_extension }}{% endif %}"

add_vcpkg:
  type: bool
  default: false
  help: Add vcpkg dependency management
  when: "{{ add_extension in ['cpp', 'cppjswasm'] }}"

python_version_primary:
  type: str
  default: 3.11
  choices:
    "3.10":
      value: "3.10"
    "3.11":
      value: "3.11"
    "3.12":
      value: "3.12"
    "3.13":
      value: "3.13"
  help: Primary version of Python to use in CI/CD
  when: "{{ add_extension not in ['uitk-svelte', 'uitk-webawesome', 'site-sveltekit', 'site-webawesome'] }}"

add_docs:
  type: bool
  default: false
  help: Add documentation using Yardang/Sphinx
  when: "{{ add_extension not in ['uitk-svelte', 'uitk-webawesome', 'site-sveltekit', 'site-webawesome'] }}"

add_wiki:
  type: bool
  default: false
  help: Add documentation using GitHub wiki
  when: "{{ add_extension not in ['uitk-svelte', 'uitk-webawesome', 'site-sveltekit', 'site-webawesome'] }}"

package_name:
  type: str
  help: What is the npm package name?
  default: "@example/branding"
  when: "{{ add_extension in ['uitk-svelte', 'uitk-webawesome'] }}"

brand_name:
  type: str
  help: What is the human-readable brand name?
  default: "{{ project_name }}"
  when: "{{ add_extension in ['uitk-svelte', 'uitk-webawesome', 'site-sveltekit', 'site-webawesome'] }}"

css_prefix:
  type: str
  help: What prefix should global CSS custom properties use?
  default: brand
  when: "{{ add_extension in ['uitk-svelte', 'uitk-webawesome'] }}"

element_prefix:
  type: str
  help: What prefix should custom elements use?
  default: brand
  when: "{{ add_extension == 'uitk-webawesome' }}"

site_url:
  type: str
  help: What is the site's canonical URL?
  default: https://example.com
  when: "{{ add_extension in ['site-sveltekit', 'site-webawesome'] }}"

site_adapter:
  type: str
  help: How should SvelteKit deploy the site?
  choices:
    Static files:
      value: static
    Node server:
      value: node
  default: static
  when: "{{ add_extension == 'site-sveltekit' }}"
